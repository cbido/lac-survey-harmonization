- target_var: aedu_ci
  sql: CASE WHEN e6a IS NULL THEN NULL WHEN e6a BETWEEN 1 AND 5 THEN 0 WHEN e6a NOT BETWEEN 6 AND 15 THEN NULL WHEN
    e6b IS NULL OR e6b < 0 THEN NULL ELSE LEAST(30, GREATEST(0, (CASE WHEN e6a IN (6,7) THEN 0 WHEN e6a IN (8,10)
    THEN 6 WHEN e6a IN (9,11) THEN 8 WHEN e6a IN (12,13) THEN 12 WHEN e6a = 14 THEN 17 WHEN e6a = 15 THEN 19 END)
