    (municipal, local education service, Junji, Integra, state universities, state CFT) and 0 otherwise. It uses
    e9depen first, then depen, then e10, and gives NULL when none has a valid value.
  assumptions: 'Junji and Integra are classed as public. Corporación de Administración Delegada (4) is classed as
    private. Please check both choices. The e10 fallback uses its own code list: 1, 5, 6 and 12 count as public.'
  written_by: model, second attempt after a failed check
  previous_sql: CASE WHEN asiste = 2 THEN 0 WHEN asiste = 1 THEN CASE WHEN COALESCE(NULLIF(e9depen,-66), NULLIF(depen,-66))
    > 0 THEN CASE WHEN COALESCE(NULLIF(e9depen,-66), NULLIF(depen,-66)) IN (1,5,6,8,12) THEN 1 ELSE 0 END WHEN e10
    > 0 THEN CASE WHEN e10 IN (1,5,12) THEN 1 ELSE 0 END ELSE NULL END ELSE NULL END
  fixed_because: People who do not attend school came out as 0, so the variable had a value for everyone. It must
    be missing (NULL) for anyone not currently attending.
