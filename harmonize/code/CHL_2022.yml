- target_var: ynlm_ci
  sql: CASE WHEN yautcor IS NULL AND ysub IS NULL THEN NULL ELSE GREATEST(0, COALESCE(yautcor,0) - COALESCE(ytrabajocor,0)
    + COALESCE(ysub,0)) END
  uses:
  - yautcor
  - ytrabajocor
  - ysub
  not_approved: []
  note: Non-labor income is corrected autonomous income minus corrected labor income, plus monetary subsidies. Missing
    components count as zero, the result is NULL when both yautcor and ysub are missing, and it is floored at 0.
  assumptions: I used the yautcor/ytrabajocor/ysub set because the alternative component list omits items such as
    pensions and would understate non-labor income. Flooring at 0 hides small negative differences between yautcor
    and ytrabajocor. It is assumed that ysub is not already included in yautcor.
  written_by: model, second attempt after a failed check
  previous_sql: CASE WHEN yautcor IS NULL AND ysub IS NULL THEN NULL ELSE (CASE WHEN yautcor IS NULL THEN 0 ELSE
    yautcor - COALESCE(ytrabajocor,0) END) + COALESCE(ysub,0) END
  fixed_because: The result has negative values (minimum -1), which an income cannot be. Floor the result at 0.
