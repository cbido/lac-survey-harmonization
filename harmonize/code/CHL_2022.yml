  assumptions: I used the raw set rather than esc because esc only covers ages 15 and over. The base years for master's
    (17) and doctorate (19) and the old-system bases (6) are my assumptions. e6b is assumed to hold the course number
    1..n. A missing e3 is treated as not attending.
